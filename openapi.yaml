openapi: 3.0.3
info:
  title: Rick and Morty API
  version: 1.0.0
  description: API for querying Rick and Morty characters with authentication and favorite management

servers:
  - url: http://localhost:8000
    description: Development server

paths:
  /api/characters:
    get:
      summary: List characters
      tags:
        - Characters
      parameters:
        - $ref: '#/components/parameters/NameFilter'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/SpeciesFilter'
        - $ref: '#/components/parameters/GenderFilter'
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            default: 1
      responses:
        '200':
          $ref: '#/components/responses/PaginatedCharacters'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/characters/{id}:
    get:
      summary: Get a specific character
      tags:
        - Characters
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Character details with relations
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Character'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "John Doe"
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                password:
                  type: string
                  minLength: 6
                  example: "password123"
              required:
                - name
                - email
                - password
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: API token for authentication
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/login:
    post:
      summary: Login user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                password:
                  type: string
                  example: "password123"
              required:
                - email
                - password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: API token for authenticated requests
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/logout:
    post:
      summary: Logout user
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/user/favorites:
    get:
      summary: Get user's favorite characters
      tags:
        - Favorites
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            default: 1
      responses:
        '200':
          $ref: '#/components/responses/PaginatedCharacters'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/characters/{id}/favorite:
    post:
      summary: Add character to favorites
      tags:
        - Favorites
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Character added to favorites
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    delete:
      summary: Remove character from favorites
      tags:
        - Favorites
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Character removed from favorites
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: API token obtained from /api/login or /api/register

  parameters:
    NameFilter:
      name: name
      in: query
      description: Filter characters by name (case-insensitive, partial match)
      required: false
      schema:
        type: string
        example: "rick"
    StatusFilter:
      name: status
      in: query
      description: Filter characters by status (Alive, Dead, unknown)
      required: false
      schema:
        type: string
        enum: ["Alive", "Dead", "unknown"]
    SpeciesFilter:
      name: species
      in: query
      description: Filter characters by species
      required: false
      schema:
        type: string
        example: "Human"
    GenderFilter:
      name: gender
      in: query
      description: Filter characters by gender (Male, Female, Genderless, unknown)
      required: false
      schema:
        type: string
        enum: ["Male", "Female", "Genderless", "unknown"]

  responses:
    PaginatedCharacters:
      description: Paginated list of characters
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              message:
                type: string
              data:
                type: object
                properties:
                  current_page:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Character'
                  first_page_url:
                    type: string
                    format: uri
                  from:
                    type: integer
                    nullable: true
                  last_page:
                    type: integer
                  last_page_url:
                    type: string
                    format: uri
                  next_page_url:
                    type: string
                    format: uri
                    nullable: true
                  path:
                    type: string
                  per_page:
                    type: integer
                  prev_page_url:
                    type: string
                    format: uri
                    nullable: true
                  to:
                    type: integer
                    nullable: true
                  total:
                    type: integer
                required:
                  - current_page
                  - data
                  - last_page
                  - per_page
                  - total
            required:
              - success
              - message
              - data

    UnauthorizedError:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Character:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        external_id:
          type: integer
          format: int64
        name:
          type: string
        status:
          type: string
          nullable: true
          enum: ["Alive", "Dead", "unknown"]
        species:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        gender:
          type: string
          nullable: true
          enum: ["Male", "Female", "Genderless", "unknown"]
        image:
          type: string
          format: uri
          nullable: true
        origin:
          $ref: '#/components/schemas/Location'
          nullable: true
        currentLocation:
          $ref: '#/components/schemas/Location'
          nullable: true
        episodes:
          type: array
          items:
            $ref: '#/components/schemas/Episode'
        raw_data:
          type: object
          nullable: true
          additionalProperties: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - id
        - external_id
        - name

    Location:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        external_id:
          type: integer
          format: int64
          nullable: true
        name:
          type: string
        type:
          type: string
          nullable: true
        dimension:
          type: string
          nullable: true
        raw_data:
          type: object
          nullable: true
          additionalProperties: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - id
        - name

    Episode:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        external_id:
          type: integer
          format: int64
        name:
          type: string
        air_date:
          type: string
          nullable: true
        episode_code:
          type: string
          nullable: true
        raw_data:
          type: object
          nullable: true
          additionalProperties: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - id
        - external_id
        - name

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
        email:
          type: string
          format: email
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - id
        - name
        - email

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
        errors:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: string
          nullable: true
      required:
        - success
        - message
